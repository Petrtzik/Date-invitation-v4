<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#fae3eb"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-title" content="Date 💖"><link rel="manifest" href="/manifest.webmanifest"><title>Date Invitation 💖</title><style>*{box-sizing:border-box}body{margin:0;min-height:100dvh;background:radial-gradient(circle at 20% 10%,#fff 0,#ffe9f1 50%,#f8d6e5 100%);font-family:system-ui,-apple-system,sans-serif;color:#692d4c;display:grid;place-items:center;padding:22px}.card{width:min(100%,460px);background:#ffffffd9;box-shadow:0 20px 70px #b94d7c30;border:1px solid #fff;border-radius:30px;padding:32px 24px;text-align:center}h1{font-size:clamp(27px,7vw,38px);margin:8px 0 14px}.heart{font-size:56px}p{line-height:1.5;color:#875a70}button{border:0;border-radius:18px;padding:15px 22px;font-size:17px;font-weight:750;background:#ed5c99;color:#fff;cursor:pointer;touch-action:manipulation}button.secondary{background:#fff;color:#ad4674;border:2px solid #f3c3d7}button:disabled{opacity:.55}button.choice{width:100%;margin:6px 0;background:#fff;color:#9d3968;border:2px solid #f3c3d7}button.choice.selected{background:#ed5c99;color:#fff;border-color:#ed5c99}.buttons{display:flex;gap:12px;justify-content:center;align-items:center;min-height:105px;position:relative}#no{position:relative;transition:transform .16s}label{display:block;text-align:left;margin:15px 0 7px;font-weight:700}input{width:100%;border:2px solid #f2c4d6;background:white;border-radius:13px;padding:14px;font-size:17px;color:#692d4c}.hidden{display:none!important}.status{min-height:23px;margin-top:12px;font-size:14px}.footer{font-size:12px;margin-top:22px}</style></head><body><main class="card"><div class="heart">💌</div><section id="intro"><h1>Will you go on a date with me?</h1><p>I have a little something planned… 💕</p><div class="buttons"><button id="yes">YES! 💖</button><button id="no" class="secondary">No 🙈</button></div></section><section id="choose" class="hidden"><h1>It's a date! 🥰</h1><p>What would you like to do?</p><div id="choices"><button class="choice" data-choice="Dinner 🍝">Dinner 🍝</button><button class="choice" data-choice="Coffee ☕">Coffee ☕</button><button class="choice" data-choice="Drinks 🍸">Drinks 🍸</button><button class="choice" data-choice="Surprise me ✨">Surprise me ✨</button></div><button id="next" disabled>Continue →</button></section><section id="when" class="hidden"><h1>Pick our moment 💗</h1><p id="activityLabel"></p><label for="date">Date</label><input id="date" type="date" required><label for="time">Time</label><input id="time" type="time" required><div style="margin-top:24px"><button id="confirm">Confirm our date 💘</button></div><div id="status" class="status" role="status" aria-live="polite"></div></section><section id="done" class="hidden"><h1>It's official! 💞</h1><p id="summary"></p><p>Your answer has been sent. Can't wait! ✨</p></section><p class="footer">Made with love 💖</p></main><script>let choice='';const show=id=>{for(const s of ['intro','choose','when','done'])document.getElementById(s).classList.toggle('hidden',s!==id)};document.getElementById('yes').onclick=()=>show('choose');const no=document.getElementById('no');let dodges=0;function dodge(e){if(e)e.preventDefault();dodges++;const x=(Math.random()-.5)*Math.min(180,window.innerWidth*.42),y=(Math.random()-.5)*75;no.style.transform=`translate(${x}px,${y}px)`;if(dodges>6)no.textContent='YES instead? 🥹'}no.addEventListener('pointerenter',e=>{if(e.pointerType==='mouse')dodge(e)});no.addEventListener('touchstart',dodge,{passive:false});no.addEventListener('click',dodge);document.querySelectorAll('[data-choice]').forEach(b=>b.onclick=()=>{choice=b.dataset.choice;document.querySelectorAll('[data-choice]').forEach(c=>c.classList.toggle('selected',c===b));document.getElementById('next').disabled=false});document.getElementById('next').onclick=()=>{document.getElementById('activityLabel').textContent=choice;const today=new Date();const local=new Date(today.getTime()-today.getTimezoneOffset()*60000).toISOString().slice(0,10);document.getElementById('date').min=local;show('when')};document.getElementById('confirm').onclick=async()=>{const date=document.getElementById('date').value,time=document.getElementById('time').value,status=document.getElementById('status'),btn=document.getElementById('confirm');if(!date||!time){status.textContent='Please select a date and time.';return}if(date<document.getElementById('date').min){status.textContent='Please choose a future date.';return}btn.disabled=true;status.textContent='Sending your answer…';try{const r=await fetch('/api/confirm',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({activity:choice,date,time})});if(!r.ok)throw Error('Could not send notification');document.getElementById('summary').textContent=`${choice} · ${date} at ${time}`;show('done')}catch(e){status.textContent='Could not send the notification. Please try again.';btn.disabled=false}};</script></body></html>
